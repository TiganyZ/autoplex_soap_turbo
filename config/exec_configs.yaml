# jobflow-remote exec_config blocks: the environment a calculation needs beyond
# the Python environment itself -- compilers, MPI, the FHI-aims binary.
#
# These are merged verbatim into the generated jobflow-remote project, so the
# syntax is jobflow-remote's own. Point `aims_exec_config=` in machines.conf at
# the block a machine should use.
#
# No credentials belong in this file; it is tracked in git.

roihu_aims_config:
  modules:
    - gcc/15.2.0
    - openmpi/5.0.10
    - openblas/0.3.30
    - netlib-scalapack/2.2.2
  export:
    AIMS_ROOT: "/projappl/project_2017844/install/FHIaims"
    ELPA_ROOT: "/projappl/project_2017844/install/elpa-2026.02.001"
    AIMS_BUILD: "build_gnu_17_no_openmp_openmpi_avx512_cpu"
    AIMS_BUILD_DIR: "${AIMS_ROOT}/${AIMS_BUILD}"
    ELPA_BUILD_DIR: "${ELPA_ROOT}/${AIMS_BUILD}"
    AIMS_SPECIES_DIR: "${AIMS_ROOT}/species_defaults/defaults_2020"
    LD_LIBRARY_PATH: "${ELPA_BUILD_DIR}/lib:${LD_LIBRARY_PATH}"
    INCLUDE: "${ELPA_BUILD_DIR}/modules:${INCLUDE}"
    PATH: "${AIMS_BUILD_DIR}:${PATH}"
    OMP_NUM_THREADS: 1
  pre_run: |
    source /etc/profile
    source ~/.bashrc
    ulimit -s unlimited

roihu_aims_gpu_config:
  modules:
    - nvhpc
  export:
    AIMS_ROOT: "/projappl/project_2017844/install/gpu/FHIaims"
    ELPA_ROOT: "/projappl/project_2017844/install/gpu/elpa-2026.02.002"
    AIMS_BUILD: "build_nvhpc_seq_gpu"
    AIMS_BUILD_DIR: "${AIMS_ROOT}/${AIMS_BUILD}"
    ELPA_BUILD_DIR: "${ELPA_ROOT}/${AIMS_BUILD}"
    AIMS_SPECIES_DIR: "${AIMS_ROOT}/species_defaults/defaults_2020"
    LD_LIBRARY_PATH: "${ELPA_BUILD_DIR}/lib:${LD_LIBRARY_PATH}"
    INCLUDE: "${ELPA_BUILD_DIR}/modules:${INCLUDE}"
    PATH: "${AIMS_BUILD_DIR}:${PATH}"
  pre_run: |
    source /etc/profile
    source ~/.bashrc
    ulimit -s unlimited

roihu_vasp_config:
  export:
    OMP_NUM_THREADS: 1
  pre_run: |
    source /etc/profile
    source ~/.bashrc
    module use /projappl/project_2020289/modules/modulefiles
    module load vasp/cpu/6.6.1
    ulimit -s unlimited

# turboGAP with the MAD-IR feature branch: ir_fft.f90, mad_ir_xl.f90 and the
# GLE thermostat. A SEPARATE BINARY from the one the sampling workflows use,
# because it is built from `feature/ir` rather than from what is on master, and
# because two workflows sharing one bin/turbogap means a rebuild for one of them
# silently changes the other.
#
# TURBOGAP_BIN is a fallback: workflows/water_ir_matching names `executable`
# explicitly, and turbogap/ir.py only consults the environment when it does not.
# DOSPT_BIN has no such fallback -- the equilibration check reads it or PATH.
roihu_turbogap_ir_config:
  modules:
    - gcc/15.2.0
    - openmpi/5.0.10
    - openblas/0.3.30
  export:
    TURBOGAP_BIN: "/projappl/project_2017844/turbogap_feature_ir/bin/turbogap"
    DOSPT_BIN: "/projappl/project_2017844/dospt/bin/DoSPT"
    OMP_NUM_THREADS: 1
  pre_run: |
    source /etc/profile
    source ~/.bashrc
    ulimit -s unlimited
