# GAP hyperparameters for the water dipole model.
#
# Loaded as autoplex.settings.MLIPHypers, so anything not listed here falls back
# to the defaults in autoplex.settings.GAPSettings. The values below reproduce
# the reference fit on Triton.
#
# The per-species entries (alpha_max, atom_sigma_r, atom_sigma_t, the two
# scalings, amplitude_scaling, central_weight) take either one value, broadcast
# to every species, or one value per species in the order of `species_list` in
# training.yaml -- here H then O.

GAP:
  general:
    # Only soap_turbo. turboGAP cannot evaluate QUIP's `soap` or `distance_Nb`,
    # so leaving those on would give a potential that fits but cannot convert.
    two_body: false
    three_body: false
    soap: false
    distance_2b: false
    angle_3b: false
    soap_turbo: true

    sparse_jitter: 1.0e-8

  soap_turbo:
    # Cutoffs. rcut_soft is where the smooth cutoff begins; the 0.5 A buffer to
    # rcut_hard is what turboGAP assumes.
    rcut_hard: 5.5
    rcut_soft: 5.0

    l_max: 8
    # 8 radial functions needs the poly3gauss basis: above 7 the plain poly3
    # basis is numerically unstable, and QUIP makes it an error above 10.
    alpha_max: 8
    basis: poly3gauss

    atom_sigma_r: 0.5
    atom_sigma_t: 0.5
    atom_sigma_r_scaling: 0.0
    atom_sigma_t_scaling: 0.0

    # 2.0, not 1.0, and this one is measured rather than inherited.
    #
    # A neighbour's amplitude is the smooth cutoff polynomial raised to this
    # power (soap_turbo_radial.f90:1638). At 1.0 it decays gently, so the
    # descriptor is a broad sum over the whole 5.5 A neighbourhood and a 0.05 A
    # change in the NEAREST neighbour -- which is what an OH stretch is -- is a
    # small perturbation on a large flat total. Squaring it concentrates the
    # weight on the close neighbours, i.e. on a molecule's own covalently bonded
    # hydrogen at 0.97 A.
    #
    # Measured on ten molecules in liquid water, d(mu)/d(r_OH) along the bond:
    # 0.102 e at amplitude_scaling 1.0, 0.370 e at 2.0, with everything else
    # held fixed. That is the OH-stretch IR intensity, and it goes as the
    # square. Held-out total dipole RMSE moves 0.05489 -> 0.05454, i.e. the
    # change is free; the RMSE could not see the problem either way, because it
    # is dominated by molecular orientation.
    amplitude_scaling: 2.0
    central_weight: 1.0

    scaling_mode: polynomial
    radial_enhancement: 1

    # Descriptor compression. QUIP needs both: compress_soap switches it on,
    # compress_mode names the recipe. Setting only the mode leaves compression
    # off, and the fit then differs from the reference for no visible reason.
    compress_soap: "true"
    compress_mode: trivial

    zeta: 4
    covariance_type: dot_product
    # delta sets the energy scale the descriptor is allowed to explain. For a
    # dipole fit it is not scaled automatically, because there is no energy
    # residual to scale it against.
    delta: 0.1
    f0: 0.0

    n_sparse: 500
    sparse_method: cur_points
