# The FHI-aims alternative to training.yaml: the same clusters, DFPT dipole and
# polarizability of the truly isolated cluster (no box, no dilute-gas conversion).
# PBE with tight species defaults -- the functional of the VASP labels but a
# different basis, so these energies do not share the VASP reference: madlib's
# make_sets.py gives aims cluster energies zero weight (forces and dipoles keep theirs).
name: sei_response_aims
species_list: [Li, Na, C, O, F, H, P]
iterations: 1

dataset:
  initial: data/example_clusters.xyz
  dipole_key: mu
  polarizability_key: alpha
  dipole_unit: e*angstrom
  polarizability_unit: angstrom^3
  periodic: false
  seed: 0

aims:
  worker: roihu_worker
  exec_config: roihu_aims_config
  # The dispatcher only; each calculation is sized by the tiers.
  resources: {account: project_2003566, partition: small, nodes: 1,
              ntasks_per_node: 1, time: "00:10:00", mem: 8G}
  # About 1-3 atoms per rank.
  resource_tiers:
    - max_atoms: 30
      resources: {account: project_2003566, partition: small, nodes: 1,
                  ntasks_per_node: 16, time: "01:00:00", mem_per_cpu: 2G}
    - max_atoms: null
      resources: {account: project_2003566, partition: small, nodes: 1,
                  ntasks_per_node: 32, time: "01:30:00", mem_per_cpu: 2G}
  max_attempts: 3
  walltime_margin: 300.0
  molecular: true
  user_params:
    # Absolute: Roihu's ~/.config/.pmgrc.yaml points AIMS_SPECIES_DIR at project_2017844,
    # which this account can no longer read. pymatgen takes the last component as the basis.
    species_dir: /projappl/project_2006384/install/FHIaims/species_defaults/defaults_2020/tight
    xc: pbe
    output_level: normal
    electric_field_response: DFPT
    output: [dipole, mulliken]
    compute_forces: true
    sc_iter_limit: 200
    sc_accuracy_rho: 1.0e-5
    sc_accuracy_eev: 1.0e-3
    sc_accuracy_etot: 1.0e-6
    override_illconditioning: .true.
    KS_method: parallel
    distributed_spline_storage: true
  require_all: false

# Unused by this flow; present because TrainingConfig validates them.
fit:
  hyperparameters_file: gap_hypers.yaml
energy_fit:
  enabled: false
validation:
  enabled: false
