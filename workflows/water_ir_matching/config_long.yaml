# The 64-molecule box again, long enough to measure something.
#
# WHY THIS EXISTS. config_trial.yaml proved the plumbing and then measured
# nothing: at 12000 steps the autocorrelation estimators spent 7626 of them
# filling their buffer, leaving 1.09 ps of biased dynamics, and the scatter of
# the dissimilarity over that window (sd ~10 against differences of ~14) was
# wider than any effect the bias had. All three methods came out
# indistinguishable from their own references, and two of the three kept a
# residual correlation of 0.95 with them -- the bias moved intensity around
# without changing the shape of the error at all.
#
# Four things are different here, and each one is a lever the trial identified.
#
#   1. THE ARMS ARE FOUR TIMES LONGER.  48000 steps = 12 ps. With the buffer
#      below that leaves 36561 biased steps = 9.1 ps, which is 3.2x the buffer
#      rather than 0.36x. This is the difference between a bias effect that can
#      be measured and one that cannot.
#
#   2. THE SPECTRUM IS AVERAGED OVER MORE OF THE RUN.  ir_spectrum.dat is the
#      transform of the ROLLING BUFFER, not of the whole trajectory, so a longer
#      arm on its own does not give a better spectrum -- it gives the same 1.9 ps
#      window at the end of a longer run. lag_factor is what sets the buffer
#      against the longest lag: at 3 the ensemble is 11439 frames while the
#      longest lag stays at 3813 (still 35 cm^-1), so every lag is averaged over
#      50% more pairs. Noise in the spectrum falls as sqrt of that.
#
#   3. THE PREDICTED SPECTRUM GETS A REAL TRAJECTORY.  03_predict transforms the
#      DoS sampling run, and the trial gave it 1001 frames -- 83 cm^-1, coarser
#      than the grid being fitted. 40000 steps at stride 8 is 5001 frames over
#      10 ps, and with acf_ratio 0.2 that is a 1000-lag transform: 16.7 cm^-1.
#      This is the cheapest spectrum in the flow, because the run was needed for
#      DoSPT anyway.
#
#   4. EVERY THERMOSTAT GETS ITS OWN HAND-OFF FRAME.  Both GLE arms of the trial
#      sat at 375-380 K against a 300 K target for their entire length, because
#      a GLE built to stay out of the fitted band couples to the intramolecular
#      modes at a_pp = 2e-4 fs^-1 -- a 5 ps timescale, longer than the arm --
#      and the Bussi frame handed to it carried its excess in exactly those
#      modes. thermalise_steps runs 20000 steps (5 ps) under each arm's own
#      bath first. Watch T_mean in 05_analysis/report.md: if the GLE arms are
#      still hot, raise it or add a faster mode to the kernel.
#
# The bias ladder is the answer to "the bias did nothing": run three strengths
# on the cheapest method and one strength on the others, all sized from the same
# reference, and see whether the response is monotone in the strength before
# concluding anything about the estimator. 0.5 kT is what the trial used.
#
# COST. 9 arms x 48000 steps at 16 ranks. The trial ran 12000 steps in ~24 min
# on 16 ranks, so an arm is ~95 min, the equilibration stage is ~3.5 h, and the
# flow is ~5.5 h wall-clock with the arms in parallel (each biased arm waits for
# its reference). Roughly 350 core-hours.
#
# See config.yaml for what every key means.

name: water_ir_matching_long
workdir: /scratch/project_2017844/anni_water/ir_matching_long
start_structure: /scratch/project_2017844/anni_water/structures/atoms_water_64_molecules.xyz
experiment: /scratch/project_2017844/anni_water/ir_spectrum_water_exp_downing.dat

turbogap:
  energy_gap: /scratch/project_2017844/anni_water/gap_files/water_vdw_gen6_g4.gap
  dipole_gap: /scratch/project_2017844/anni_water/dipole_model/dipole.gap
  species:
  - H
  - O
  masses:
  - 1.008
  - 15.999
  md_step: 0.25
  thermostat: bussi
  tau_t: 100.0
  seed: 12345

  # 16, not 48, and measured rather than guessed: the trial ran 12000 steps in
  # ~24 min on 16 ranks. 192 atoms over 48 ranks is 4 atoms per rank, which is
  # past the point where the halo costs more than the work. An arm here is
  # 48000 steps, so ~95 min; the equilibration stage runs melt + equilibrate +
  # thermalise + DoS back to back -- 104000 steps, ~3.5 h -- which is what the
  # 8 h walltime below is sized for.
  ntasks: 16
  executable: /projappl/project_2017844/turbogap_feature_ir/bin/turbogap

  # srun, not mpirun: inside a Slurm allocation srun inherits the job's binding
  # and cgroup, and OpenMPI's mpirun then has to be told everything Slurm
  # already knows. ntasks_flag follows from the launcher's name.
  mpirun: srun
  vdw:
    type: ts
    rcut: 25.0

ir:
  temperature: 300.0

  # 1 ps at 600 K to forget the structure the starting configuration was built
  # with, then 10 ps at 300 K. The trial's 0.5 ps equilibration left E_kin
  # drifting 3.3% between DoSPT windows and handed the arms a frame at 353.8 K.
  melt_steps: 4000
  melt_temperature: 600.0
  equil_steps: 40000

  # Under each arm's own bath, after the common equilibration. 5 ps is a few
  # times the GLE's own a_pp timescale; the Bussi arms do not need it and do not
  # get a stage (only non-default thermostats do).
  thermalise_steps: 20000

  # 10 ps at 2 fs = 5001 frames. Feeds BOTH DoSPT and the predicted spectrum:
  # 1000 lags at acf_ratio 0.2 is 16.7 cm^-1, against the trial's 83.
  dospt_steps: 40000
  dospt_stride: 8
  dospt_windows: 4
  dospt_executable: /projappl/project_2017844/dospt/bin/DoSPT

  # Now that the equilibration is 10 ps, a failure here is worth stopping for.
  stop_if_not_equilibrated: true

  nu_min: 400.0
  nu_max: 4000.0
  resolution: 35.0

  # 3, not 2. The buffer is lag_factor*c/(resolution*md_step) = 11439 frames
  # while the longest lag transformed stays 3813, so each lag averages over
  # ~11400 pairs instead of ~7600. See note 2 at the top.
  lag_factor: 3
  stride: 1

  tau_mem: 300.0
  n_modes: 101
  quantum_correction: harmonic
  acf_ratio: 0.2
  acf_ratio_md: 0.5
  smooth_k: 10

  # 12 ps. Buffer 11439 steps, so 36561 biased steps = 9.1 ps = 3.2x the buffer.
  arm_steps: 48000
  arm_write_xyz: 4000

  # ONE UNBIASED ARM PER METHOD, and one biased arm per rung of its ladder. The
  # reference is shared down a ladder and never between methods:
  # exp_energy_scales multiplies a dissimilarity, each estimator's dissimilarity
  # is in its own arbitrary units, and the only way to push them with the same
  # ENERGY is to size each from an arm measured by the same meter. gle needs its
  # own for the second reason that it changes the dynamics and not just the
  # meter.
  arms:
    # The cheapest estimator carries the ladder: three strengths spanning a
    # factor of four, so a response that is real shows up as monotone in the
    # strength rather than as one arm that happened to land low.
    - name: naive
      thermostat: bussi
      bias_mode: acf
      acf_mode: block
      bias_ladder: [0.25, 0.5, 1.0]
      label: "block ACF: spectrum from the buffer, differentiated, forced, each step"

    # xl starts reporting after ~ir_xl_tau_mem rather than after a full buffer,
    # so it biases for ~11.2 ps of the 12 -- the longest biased window in the
    # flow, and the reason to give it a second rung.
    - name: xl
      thermostat: bussi
      bias_mode: xl
      bias_ladder: [0.5, 1.0]
      label: "mad_ir_xl: a bank of damped resonators whose amplitude is the spectrum"

    # One rung only: the gle arms are the ones on trial for their temperature,
    # and a strength scan on a bath that may not have arrived measures the bath.
    - name: gle
      thermostat: gle
      bias_mode: acf
      acf_mode: block
      bias_target_kt: 0.5
      label: "the same block ACF bias under the GLE thermostat"

  # Required by any arm with thermostat = gle; there is no default, and a GLE
  # without a kernel is not a thermostat. Built by make_gle_kernel.py for a fit
  # from 400 cm^-1: a_pp = 2e-4 fs^-1 with modes (0.020, 0.0020) and
  # (0.006, 0.0002) fs^-1, holding the slow modes at Ktilde(0) = 0.38 fs^-1 and
  # adding 1.07 cm^-1 of width at 3400 -- against the 53 cm^-1 a Langevin
  # tau_t = 100 fs adds at EVERY frequency.
  #
  # THE SAME a_pp IS WHY THE GLE ARMS RAN HOT: it is also the rate at which the
  # bath exchanges energy with the band, so 2e-4 fs^-1 is a 5 ps thermalisation.
  # thermalise_steps above pays that cost once instead of inside every arm. If
  # the arms are still hot in the report, the next lever is a third mode with
  # lambda ~ 2e-3 fs^-1, which costs ~1 cm^-1 more width inside the band.
  gle_a_file: /scratch/project_2017844/anni_water/gle/gle_A.dat

  bias_target_kt: 0.5
  bias: true

md_worker:
  # ntasks_per_node matches turbogap.ntasks: every stage launches `srun -n 16`
  # from inside its own Slurm job, so the allocation has to be at least that
  # wide or the step will not start. The trial asked for 48 and used 16, which
  # billed three times what it ran.
  #
  # time is 08:00:00 rather than the trial's 04:00:00, because the equilibration
  # stage is now four stages in one job. See the ntasks note above.
  worker: roihu_cpu_turbogap
  # `small`, not `medium`, and this is a scheduling fact rather than a
  # preference: CSC opened a week-long `kernel-upg-test-cpu` reservation on
  # 2026-08-25T09:51 that swallowed 258 of medium's nodes, and every medium job
  # -- including a 30-second one -- was being estimated to start on 2026-09-01.
  # `small` and `longrun` are outside the reservation and started a probe job
  # within 75 s. small's limit is 3 days, so the 8 h below fits with room.
  resources:
    account: project_2003566
    partition: small
    nodes: 1
    ntasks_per_node: 16
    time: "08:00:00"

analysis_worker:
  # NOT local. The runner is on alt and DoSPT is built on Roihu, so the
  # equilibration check has to run where its binary is. Single-threaded apart
  # from DoSPT's OpenMP, hence one task and a few cores rather than 48. The
  # analysis stage runs here too: it reads thermo.log and the spectra and writes
  # tables, gnuplot scripts and reports, so it needs no MPI at all.
  worker: roihu_cpu_turbogap
  resources:
    account: project_2003566
    partition: small          # see md_worker
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    time: "02:00:00"
