# A short end-to-end pass of the same flow, for proving the plumbing.
#
# Every stage runs and every file is written; none of the numbers mean
# anything. 100 fs of melt, 500 fs of equilibration and 1 ps per arm. The
# DoS sampling is the one thing kept near full length (2 ps, 1000 frames,
# 250 per window) because DoSPT refuses a window under 100 frames and the
# point of the trial is that DoSPT actually runs.
#
# arm_steps is 12000 and not smaller: the fft estimator buffers
# lag_factor*c/(resolution*md_step) = 7626 frames before it reports a
# dissimilarity at all, so a shorter arm produces a trajectory and nothing to
# size a bias from. The flow now refuses such an arm up front.
#
# stop_if_not_equilibrated is off: a 500 fs equilibration has not
# equilibrated, and failing on that would prove nothing except that the
# check works. The composition census still has to pass.
#
# See config.yaml for what every key means.

name: water_ir_matching_trial
workdir: /scratch/project_2017844/anni_water/ir_matching_flow
start_structure: /scratch/project_2017844/anni_water/structures/atoms_water_64_molecules.xyz
experiment: /scratch/project_2017844/anni_water/ir_spectrum_water_exp_downing.dat
turbogap:
  energy_gap: /scratch/project_2017844/anni_water/gap_files/water_vdw_gen6_g4.gap
  dipole_gap: /scratch/project_2017844/anni_water/dipole_model/dipole.gap
  species:
  - H
  - O
  masses:
  - 1.008
  - 15.999
  md_step: 0.25
  thermostat: bussi
  tau_t: 100.0
  seed: 12345
  ntasks: 16
  executable: /projappl/project_2017844/turbogap_feature_ir/bin/turbogap

  # srun, not mpirun: inside a Slurm allocation srun inherits the job's
  # binding and cgroup, and OpenMPI's mpirun then has to be told everything
  # Slurm already knows. ntasks_flag follows from the launcher's name.
  mpirun: srun
  vdw:
    type: ts
    rcut: 25.0
ir:
  temperature: 300.0
  melt_steps: 400
  melt_temperature: 600.0
  equil_steps: 2000
  dospt_steps: 8000
  dospt_stride: 8
  dospt_windows: 4
  dospt_executable: /projappl/project_2017844/dospt/bin/DoSPT
  stop_if_not_equilibrated: false
  nu_min: 400.0
  nu_max: 4000.0
  resolution: 35.0
  lag_factor: 2
  stride: 1
  tau_mem: 300.0
  n_modes: 101
  quantum_correction: harmonic
  acf_ratio: 0.2
  acf_ratio_md: 0.5
  smooth_k: 10
  arm_steps: 12000
  arm_write_xyz: 1000
  # THREE MATCHING METHODS, each run twice from the same equilibrated structure
  # -- once unbiased, once biased -- for the same number of steps, so that what
  # the bias did is the difference between the two and nothing else.
  #
  # Each pair carries its own unbiased arm on purpose. exp_energy_scales
  # multiplies a dissimilarity, and each estimator's dissimilarity is in its own
  # arbitrary units, so sizing every method from one shared reference would push
  # them with different energies. `gle` needs its own for a second reason: it
  # changes the dynamics, not just the meter.
  arms:
    - name: naive
      thermostat: bussi
      bias_mode: acf
      acf_mode: block
      label: "block ACF: spectrum from the buffer, differentiated, forced, each step"
    - name: xl
      thermostat: bussi
      bias_mode: xl
      label: "mad_ir_xl: a bank of damped resonators whose amplitude is the spectrum"
    - name: gle
      thermostat: gle
      bias_mode: acf
      acf_mode: block
      label: "the same block ACF bias under the GLE thermostat"

  # Required by any arm with thermostat = gle; there is no default, and a GLE
  # without a kernel is not a thermostat. Built by make_gle_kernel.py for a fit
  # from 400 cm^-1: a_pp = 2e-4 fs^-1 with modes (0.020, 0.0020) and
  # (0.006, 0.0002) fs^-1, which holds the slow modes at Ktilde(0) = 0.38 fs^-1
  # and adds 1.07 cm^-1 of width at 3400 -- against the 53 cm^-1 that a Langevin
  # tau_t = 100 fs adds at EVERY frequency.
  gle_a_file: /scratch/project_2017844/anni_water/gle/gle_A.dat
  bias_target_kt: 0.5
  bias: true
md_worker:
  # jobflow-remote's Roihu turboGAP worker, with the exec_config that points at
  # the feature/ir binary and at DoSPT. The worker supplies the account and the
  # host; the exec_config supplies the modules and the two binaries; these
  # resources size the allocation each stage gets.
  #
  # ntasks_per_node is 48 to match turbogap.ntasks: every stage launches
  # `srun -n 48` from inside its own Slurm job, so the allocation has to be at
  # least that wide or the step will not start.
  worker: roihu_cpu_turbogap
  resources:
    account: project_2017844
    partition: medium
    nodes: 1
    ntasks_per_node: 48
    time: "04:00:00"

  # exec_config: roihu_turbogap_ir_config
  #
  # COMMENTED OUT, AND NOT BECAUSE IT IS WRONG. The block is defined in
  # config/exec_configs.yaml and deployed in the project file, but a
  # jobflow-remote runner reads its configuration when the daemon STARTS -- a
  # newly added exec_config is invisible until `jf runner restart`, and the job
  # fails at submission with "ExecutionConfig with id ... is not defined". The
  # daemon on alt is carrying live campaigns, so uncomment this after the next
  # time it restarts for its own reasons rather than restarting it for this.
  #
  # Nothing is lost meanwhile: the worker's own env.sh already loads gcc/15.2.0,
  # openmpi/5.0.10 and openblas/0.3.30 and sets ulimit -s unlimited, and both
  # binaries are named explicitly here (turbogap.executable and
  # ir.dospt_executable) rather than taken from TURBOGAP_BIN or DOSPT_BIN. The
  # exec_config only makes those defaults right for a deck that omits them --
  # note that env.sh's TURBOGAP_BIN points at the SAMPLING build, not this one.

analysis_worker:
  # NOT local. The runner is on alt and DoSPT is built on Roihu, so the
  # equilibration check has to run where its binary is. It is single-threaded
  # apart from DoSPT's OpenMP, hence one task and a few cores rather than 48.
  worker: roihu_cpu_turbogap
  resources:
    account: project_2017844
    partition: medium
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    time: "01:00:00"
  # exec_config: roihu_turbogap_ir_config    # see md_worker above
