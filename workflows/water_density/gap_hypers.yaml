# GAP hyperparameters for the water dipole model.
#
# Loaded as autoplex.settings.MLIPHypers, so anything not listed falls back to
# the defaults in autoplex.settings.GAPSettings.
#
# Per-species entries take either one value, broadcast to every species, or one
# value per species in the order of `species_list` in training.yaml -- here
# H then O.
#
# Note that this is *not* the frozen potential's species list. The CHO potential
# that drives the sampling covers three elements; water contains two, and a
# dipole model cannot be fitted for a species with no environments in the
# training set. `sampling.species_list` in training.yaml carries the potential's
# three for turboGAP's benefit; this file and `species_list` describe the data.

GAP:
  general:
    # Only soap_turbo. turboGAP cannot evaluate QUIP's `soap` or `distance_Nb`,
    # so leaving those on would give a potential that fits but cannot convert.
    two_body: false
    three_body: false
    soap: false
    distance_2b: false
    angle_3b: false
    soap_turbo: true

    sparse_jitter: 1.0e-8

  soap_turbo:
    # Everything below except the cutoff is taken from the frozen CHO energy
    # potential's own soap_turbo blocks (CHO_gap/gap_files/CHO.gap) rather than
    # chosen afresh: that descriptor has already been fitted and validated for
    # this chemistry, which is a stronger argument than anything that could be
    # reasoned out here from bond lengths.
    #
    # The cutoff is the deliberate exception. The energy model uses 4.0 A, which
    # reaches an ethanol molecule's first solvation shell and not much past it.
    # That is enough for energies and forces, which are dominated by the near
    # field -- but the quantity being fitted here is a dipole, and in a
    # hydrogen-bonded liquid the intermolecular contribution to it is both large
    # and longer-ranged than the forces that produce it. A model that cannot see
    # past the first shell cannot represent the part of the dipole that the IR
    # spectrum is mostly made of.
    #
    # The cost of the difference is real and worth stating: the dipole and
    # energy models are concatenated into one turboGAP potential file, so
    # matching cutoffs would let turboGAP build a single neighbour list for
    # both. At 5.0 A it builds the larger one and the energy model uses a subset
    # of it, which is more neighbour-list work per step in every sampling MD and
    # in the production liquid run afterwards.
    rcut_hard: 5.0
    # The energy potential writes rcut = 4.0 with buffer = 0.5, i.e. a 0.5 A
    # smooth turn-off; the same buffer is kept here.
    rcut_soft: 4.5

    l_max: 8
    # 8 radial functions needs the poly3gauss basis: above 7 the plain poly3
    # basis is numerically unstable, and QUIP makes it an error above 10.
    alpha_max: 8
    basis: poly3gauss

    atom_sigma_r: 0.2
    atom_sigma_t: 0.2
    atom_sigma_r_scaling: 0.1
    atom_sigma_t_scaling: 0.1
    amplitude_scaling: 2.0
    central_weight: 1.0

    scaling_mode: polynomial
    radial_enhancement: 1

    # Both are needed: compress_soap switches compression on, compress_mode
    # names the recipe. Setting only the mode leaves compression off, and the
    # fit then differs from a reference run for no visible reason.
    compress_soap: "true"
    compress_mode: trivial

    zeta: 4
    covariance_type: dot_product
    # delta sets the energy scale the descriptor may explain. For a dipole fit
    # it is not scaled automatically, because there is no energy residual to
    # scale it against.
    delta: 0.1
    f0: 0.0

    # A ceiling rather than the number used: the cap that limit_n_sparse applies
    # is reported as `n_sparse_cap` in the fit's output. Higher than the LiF
    # run's 500 because there are three species here rather than two, and the
    # ladder's later rungs put far more distinct environments in the set --
    # a 20-molecule cluster has bulk-like interiors as well as surfaces.
    #
    # Lower than the ethanol run's 1000: two species rather than three, three
    # atoms per molecule rather than nine, and a 20-molecule cluster here is 60
    # environments rather than 180. Fitting is also the step this workflow is
    # least likely to be waiting on, so there is no reason to make it the slow
    # one.
    n_sparse: 600
    sparse_method: cur_points
