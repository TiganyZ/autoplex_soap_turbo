# Iterative training against VASP reference data, on Roihu.
#
# Submit with:
#     python workflows/vasp_iterative/run.py --config workflows/vasp_iterative/vasp_rss.yaml
#
# This is the energy/force workflow. It produces a turboGAP-compatible potential,
# which is what the water dipole workflow needs as its MD sampling potential
# (sampling.energy_potential in workflows/water_dipole/training.yaml).

name: vasp_rss_water

# The search itself -- structure generation, selection, how many RSS iterations
# -- is described by autoplex's own RSS configuration.
rss_config_file: rss_config.yaml

# ------------------------------------------------------------------- workers --

# VASP statics. Roihu's CPU partition has the licence and the nodes.
vasp:
  worker: roihu_cpu_vasp
  exec_config: roihu_vasp_config
  resources:
    nodes: 1
    ntasks_per_node: 128
    time: "02:00:00"

# gap_fit. Triton has the QUIP build with soap_turbo.
fit:
  worker: triton_gapfit
  resources:
    nodes: 1
    cpus_per_task: 48
    time: "1-00:00:00"

# Structure generation, selection and bookkeeping: cheap, and they need
# buildcell, which lives with the Python environment.
general:
  worker: roihu_cpu_worker
  resources:
    nodes: 1
    ntasks_per_node: 32
    time: "04:00:00"

# ------------------------------------------------------------------- VASP -----
# The INCAR belongs in rss_config.yaml, under `custom_incar`: autoplex updates
# the static maker with those settings just before submitting, so for any key
# both files set, rss_config.yaml wins.
#
# What goes here is only a baseline for keys rss_config.yaml does not mention.
# It is merged over autoplex_soap_turbo.flows.vasp_rss.DEFAULT_INCAR. Run
# `run.py --dry-run` to see the settings that will actually reach VASP.
#
# Changing any of this mid-run makes later iterations incomparable to earlier
# ones, so set it once at the start.
user_incar_settings: {}

# A single atom in a large box needs a Gamma-point-only calculation; this is the
# KSPACING that forces one for the e0 references.
isolated_atom_kspacing: 100.0
