# Grand-canonical Monte Carlo sampling: the walk inserts and removes whole
# molecules at a chemical potential, so the training set covers sizes the seed
# does not. The full versions are workflows/water_dipole_gcmc/ and workflows/lif/.

name: example_gcmc
species_list: [H, O]

dataset:
  initial: ../minimal/seed.xyz
  dipole_key: mu
  dipole_unit: e*angstrom
  periodic: false
  box: 12.0
  train_fraction: 0.75
  seed: 0

fit:
  hyperparameters_file: ../minimal/gap_hypers.yaml

energy_fit:
  enabled: false

sampling:
  method: gcmc
  energy_potential: /path/on/sampling/machine/energy.gap
  species_list: [H, C, O]
  # One whole molecule per exchange keeps every configuration neutral.
  mc_species: [H2O]
  mc_molecule_files: [../cluster_ladder/water.xyz]
  mc_mu_reference: e0
  # eV. A guessed mu runs and means nothing; workflows/lif/validation/ calibrates one.
  mc_mu: [-0.5]
  mc_types: [move, insertion, removal]
  mc_acceptance: [2, 1, 1]
  mc_relax_after: [insertion, removal]
  n_candidates: 8
  discard_initial: 2
  # Written verbatim into turboGAP's input file.
  mc:
    mc_nsteps: 200
    mc_move_max: 0.3
    mc_relax: .true.
    mc_nrelax: 20
    mc_relax_opt: gd
    f_tol: 0.01
    max_opt_step: 0.2

selection:
  method: fps
  n_select: 2
  # A grand-canonical walk has no upper bound on size; DFT cost does.
  max_atoms: 30

iterations: 2
validation:
  enabled: false
